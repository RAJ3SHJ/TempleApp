name: Build and deploy web

on:
  push:
    branches: [admin-events-announcements]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-events-announcements
          fetch-depth: 0
      - name: Sync with main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git merge origin/main -X ours --no-edit
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href "/TempleApp/"
      - name: Publish build to main
        run: |
          cp -r build/web/* .
          git add -A
          git commit -m "Build web" || true
          git push origin HEAD:main
